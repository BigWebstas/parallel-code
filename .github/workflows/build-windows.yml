name: Build Windows

on:
  push:
    branches: [main, windows]
  pull_request:
    branches: [main, windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GYP_MSVS_VERSION: '2022'
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Test-signs with the self-signed certificate when its secrets are
      # available; pull requests from forks build unsigned.
      - name: Build
        shell: bash
        env:
          TEST_CSC_LINK: ${{ secrets.WIN_TEST_CSC_LINK }}
          TEST_CSC_KEY_PASSWORD: ${{ secrets.WIN_TEST_CSC_KEY_PASSWORD }}
        run: |
          signing=()
          if [ -n "$TEST_CSC_LINK" ]; then
            export WIN_CSC_LINK="$TEST_CSC_LINK" WIN_CSC_KEY_PASSWORD="$TEST_CSC_KEY_PASSWORD"
            signing=("-c.win.verifyUpdateCodeSignature=false")
          fi
          npm run build -- --publish never "${signing[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parallel-code-windows
          path: release/*.exe
          if-no-files-found: error
