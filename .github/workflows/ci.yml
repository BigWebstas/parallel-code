name: CI

on:
  push:
    branches: [main, windows]
  pull_request:
    branches: [main, windows]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Runners have no global Git identity, and tests that let the app create a
      # repository of its own commit into it without a local one to fall back on.
      - name: Give Git an identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Check (compile + typecheck + lint + format)
        run: npm run check

      - name: Check static (typecheck + lint + dead code + architecture)
        run: npm run check:static

      - name: Install Semgrep
        run: |
          pipx install semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test security rules
        run: npm run test:security-rules

      # Tests build throwaway Git repositories and fsync their writes under the
      # temp dir. A runner with a slow disk stalled them past the 5 s test
      # timeout while in-memory tests ran at normal speed, so keep the temp dir
      # in RAM.
      - name: Test (unit with coverage floor, client)
        run: |
          mkdir -p "$RUNNER_TEMP/ram"
          sudo mount -t tmpfs tmpfs "$RUNNER_TEMP/ram"
          TMPDIR="$RUNNER_TEMP/ram" npm run test:ci

      # The coordinator's prompt-delivery path against a real pty. Gated by
      # env locally because it takes ~20s and needs a working shell.
      - name: Test (coordinator against a real pty)
        run: npm run test:coordinator-pty

  # Windows never had coverage: POSIX-only suites (git worktrees, pty,
  # coordinator) need /bin/sh and fail there, so this job runs the static
  # checks plus the platform-agnostic unit tests that Windows support added
  # or touched.
  quality-windows:
    runs-on: windows-latest
    env:
      GYP_MSVS_VERSION: '2022'
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Give Git an identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Check (compile + typecheck + lint + format)
        run: npm run check

      - name: Check static (typecheck + lint + dead code + architecture)
        run: npm run check:static

      - name: Test (Windows-compatible unit tests)
        run: >
          npx vitest run electron/agent-hooks electron/ipc/verify.test.ts
          electron/ipc/symlink.test.ts electron/ipc/open-file.test.ts
          electron/ipc/mcp-paths.test.ts electron/ipc/command-path.test.ts
          electron/shared/command-name.test.ts electron/sessions/transcripts.test.ts
          electron/sessions/scan.test.ts electron/ipc/tasks.test.ts
          electron/install-script.test.ts electron/ipc/antigravity-usage.test.ts
          electron/ipc/validate.test.ts electron/ipc/worktree-node-modules.test.ts
          electron/mcp/delegation.test.ts electron/windows-launch.test.ts
          src/lib/path.test.ts src/lib/terminalLinks.test.ts
          src/lib/canvas-auto-open.test.ts src/lib/keybindings

      - name: Test (client suite)
        run: npm run test:client
