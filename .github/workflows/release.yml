name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --publish always

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      GYP_MSVS_VERSION: '2022'
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Signs through Azure Trusted Signing once the AZURE_SIGNING_* repository
      # variables are set. Otherwise it test-signs with the self-signed
      # certificate in WIN_TEST_CSC_LINK (see scripts/new-test-signing-cert.ps1),
      # or publishes unsigned. electron-builder authenticates with the AZURE_*
      # client secrets.
      - name: Build, sign, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          TEST_CSC_LINK: ${{ secrets.WIN_TEST_CSC_LINK }}
          TEST_CSC_KEY_PASSWORD: ${{ secrets.WIN_TEST_CSC_KEY_PASSWORD }}
        run: |
          signing=()
          if [ -n "$SIGNING_ENDPOINT" ]; then
            signing=(
              "-c.win.azureSignOptions.endpoint=$SIGNING_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$SIGNING_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$SIGNING_PROFILE"
              "-c.win.azureSignOptions.publisherName=$SIGNING_PUBLISHER"
            )
          elif [ -n "$TEST_CSC_LINK" ]; then
            export WIN_CSC_LINK="$TEST_CSC_LINK" WIN_CSC_KEY_PASSWORD="$TEST_CSC_KEY_PASSWORD"
            # Installed apps would reject updates whose self-signed certificate
            # the machine does not trust, so updates skip signature checks as
            # they do for unsigned builds.
            signing=("-c.win.verifyUpdateCodeSignature=false")
            echo "::warning::Publishing a Windows installer test-signed with a self-signed certificate."
          else
            echo "::warning::No Windows signing is configured; publishing an unsigned Windows installer."
          fi
          npm run build -- --win --publish always "${signing[@]}"

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Import code signing certificate
        env:
          DMG_CERT: ${{ secrets.DMG_CERT }}
          DMG_CERT_PWD: ${{ secrets.DMG_CERT_PWD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PWD=$(openssl rand -base64 32)

          echo -n "$DMG_CERT" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$DMG_CERT_PWD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Prepare API key for notarization
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - run: npm ci

      - name: Build, sign, and publish
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APPLE_API_KEY: ${{ runner.temp }}/private_keys/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --universal --publish always

      - name: Cleanup signing artifacts
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/private_keys/AuthKey.p8" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" 2>/dev/null || true
