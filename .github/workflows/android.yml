name: Android

# Tests and builds the phone app when it changes. Pushing an android-v* tag (for example
# android-v0.2.0) also publishes a signed APK as a GitHub release, separate from desktop v* releases.
on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      # LookPresetsGeneratedTest checks the generated looks against these desktop sources.
      - 'scripts/generate-android-looks.mjs'
      - 'src/styles.css'
      - 'src/lib/look.ts'
      - 'src/lib/theme.ts'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'scripts/generate-android-looks.mjs'
      - 'src/styles.css'
      - 'src/lib/look.ts'
      - 'src/lib/theme.ts'

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # A signed build must not restore caches that other workflow runs wrote.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/parallel-code-phone-$VERSION.apk"

      # Not marked latest, so the desktop auto-updater keeps finding the desktop release.
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Android ${{ github.ref_name }}
          files: ${{ runner.temp }}/parallel-code-phone-*.apk
          make_latest: 'false'

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
